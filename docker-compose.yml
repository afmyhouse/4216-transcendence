services:
  frontend:
    build: ./containers/frontend
    expose:
      - "80"
    env_file:
        - .env
    volumes:
      - ./containers/frontend/www:/var/www
    networks:
      - transcendence
  
  nginx:
    build: ./containers/nginx
    expose:
      - "80"
    ports:
      - "8443:443"
    env_file:
        - .env
    networks:
      - transcendence

  database:
    build: ./containers/database
    expose:
    - "5432"
    env_file:
        - .env
    networks:
      - transcendence

networks:
  transcendence:
    name: transcendence
    driver: bridge
